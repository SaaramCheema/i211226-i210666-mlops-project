name: CI Pipeline

on:
  push:
    branches: 
      - develop
  pull_request:
    branches: 
      - develop

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Check out the code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.9'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Lint with flake8
      run: |
        pip install flake8
        # Check Python files in project root and model directory
        echo "Checking critical syntax errors..."
        echo "Checking style and complexity issues..."
        flake8 *.py --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Run Unit Tests
      run: |
        pip install pytest pytest-cov
     #    pytest tests --cov=. --cov-report=term-missing --cov-report=html

    # Alternative approach for uploading artifacts
    - name: Upload Coverage Report
      if: success()
      run: |
        echo "Uploading coverage report"
        mkdir -p $GITHUB_WORKSPACE/artifacts
        cp -r htmlcov/* $GITHUB_WORKSPACE/artifacts/
        
    - name: Save Artifacts
      if: success()
      uses: actions/upload-artifact@v4.3.1
      with:
        name: coverage-report
        path: $GITHUB_WORKSPACE/artifacts/
